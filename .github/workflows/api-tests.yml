name: API Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run API tests
        run: npx playwright test
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_KEY: ${{ secrets.CLAIM_API_KEY }}

      - name: Write job summary
        if: always()
        run: node scripts/write-ci-summary.mjs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t claim-service-api-tests .

      - name: Run API tests in Docker
        run: |
          docker run --rm \
            -e API_BASE_URL="${{ vars.API_BASE_URL }}" \
            -e API_KEY="${{ secrets.CLAIM_API_KEY }}" \
            claim-service-api-tests
